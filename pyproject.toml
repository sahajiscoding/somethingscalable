[project]
name = "somethingscalable"
version = "1.0.0"
description = "WeHelpTeachers - AI answer sheet grading (Flask server + serverless API)"
requires-python = ">=3.12"
# Runtime deps for the Flask server (server.py) and the Vercel function.
# Keys are NEVER listed here — they come from the environment only.
# (Local extras stay in requirements-dev.txt.)
dependencies = [
    "flask==3.1.3",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "pymupdf==1.28.2",
    "pypdf>=5.0.0",
]
