[project]
name = "somethingscalable"
version = "1.0.0"
description = "Exam Checker - AI answer sheet grading (static frontend + serverless grading API)"
requires-python = ">=3.12"
# Lean runtime deps for Vercel's serverless function (api/grade.py).
# Streamlit is intentionally NOT here: it needs a long-running server and
# cannot run on Vercel. Local Streamlit UI installs via requirements.txt.
dependencies = [
    "google-genai>=1.20.0",
    "pypdf>=5.0.0",
]
