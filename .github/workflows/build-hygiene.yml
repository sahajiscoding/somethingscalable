name: Build Hygiene

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildcfg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Production build leaks nothing
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "poweredByHeader: false" next.config.ts || fail "X-Powered-By header is not disabled"
          grep -q "productionBrowserSourceMaps: false" next.config.ts || fail "production source maps are not disabled"
          echo "Build hygiene OK"
