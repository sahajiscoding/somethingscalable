name: API Error Helpers

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-error-helpers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  errors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Uniform generic error responses
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "export class ApiError" lib/api.ts || fail "ApiError helper is missing"
          grep -q "export function jsonError" lib/api.ts || fail "jsonError helper is missing"
          grep -q "function parseJson" lib/api.ts || fail "parseJson helper is missing"
          count=$(git ls-files 'app/api/**/*.ts' | xargs grep -l "jsonError\|parseJson" | wc -l)
          echo "Routes using safe helpers: $count"
          [ "$count" -ge 25 ] || fail "safe-helper coverage regressed (expected >= 25, got $count)"
          echo "Error helpers OK"
