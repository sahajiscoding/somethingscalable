name: Workflow Hardening

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Workflows pinned, least-privilege, secret-safe
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          for f in .github/workflows/*.yml; do
            grep -q "permissions:" "$f" || fail "$f has no permissions block"
            if grep -q "actions/checkout@" "$f" && ! grep -q "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" "$f"; then
              fail "$f uses an unpinned checkout action"
            fi
            # Self-exclusion: this checker contains those patterns as text.
            if [ "$f" != ".github/workflows/workflow-hardening.yml" ] && grep -nE "echo.*secrets\.|run:.*[$][{][{] *secrets\." "$f"; then
              fail "$f may expose secrets in logs"
            fi
          done
          echo "Workflow hardening OK"
