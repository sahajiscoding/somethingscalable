name: Security Headers

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-headers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Static security headers in next.config.ts
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "Strict-Transport-Security" next.config.ts || fail "HSTS header is missing"
          grep -q 'X-Frame-Options.*DENY' next.config.ts || fail "X-Frame-Options: DENY is missing"
          grep -q 'X-Content-Type-Options.*nosniff' next.config.ts || fail "X-Content-Type-Options: nosniff is missing"
          grep -q 'Referrer-Policy.*strict-origin-when-cross-origin' next.config.ts || fail "Referrer-Policy is missing"
          grep -q "default-src 'self'" next.config.ts || fail "static CSP fallback (default-src 'self') is missing"
          grep -q "frame-ancestors 'none'" next.config.ts || fail "CSP frame-ancestors 'none' is missing"
          if grep -q "unsafe-eval" next.config.ts; then fail "unsafe-eval found in static CSP"; fi
          echo "Static headers OK"

      - name: Per-request nonce CSP and CSRF guard in proxy.ts
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "crypto.randomUUID" proxy.ts || fail "CSP nonce is not generated per request"
          grep -q "nonce-" proxy.ts || fail "CSP nonce source is missing"
          grep -q "Content-Security-Policy" proxy.ts || fail "per-request CSP header is missing"
          grep -q "isSafeOrigin" proxy.ts || fail "CSRF same-origin check is missing"
          grep -q "csrf_origin_mismatch" proxy.ts || fail "CSRF rejection response is missing"
          grep -q "private, no-store" proxy.ts || fail "API Cache-Control private/no-store is missing"
          echo "Proxy guards OK"
