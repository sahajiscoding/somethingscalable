name: Auth Guards

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: auth-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Every non-public API route must enforce authentication
        run: |
          # These routes are intentionally public (login/signup/reset, public
          # news feed, public partner application, click capture, signed
          # webhooks, catch-all 404). Everything else must call requireUser,
          # requireAdmin, or requireAdminOwner (matched via requireAdmin).
          public=$(cat <<'EOF'
          app/api/[...notFound]/route.ts
          app/api/auth/signin/route.ts
          app/api/auth/signup/route.ts
          app/api/auth/reset-request/route.ts
          app/api/auth/reset-password/route.ts
          app/api/news/route.ts
          app/api/partner/applications/route.ts
          app/api/referrals/capture/route.ts
          app/api/webhooks/uropay/route.ts
          EOF
          )
          failed=0
          for f in $(git ls-files 'app/api/**/route.ts'); do
            # -F: paths contain regex chars ([...notFound]) — match literally.
            if echo "$public" | grep -qxF "$f"; then continue; fi
            if ! grep -qE "requireUser|requireAdmin" "$f"; then
              echo "FAIL: $f has no requireUser/requireAdmin/requireAdminOwner gate"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "Auth gates OK"

      - name: No shared admin password path
        run: |
          if grep -rn "body\.password" app/api/c8f2x9/login/route.ts; then
            echo "FAIL: admin login still accepts a shared password"
            exit 1
          fi
          if grep -rn "ADMIN_PASSWORD" app lib --include='*.ts' | grep -v "AGENTS.md\|SECURITY.md"; then
            echo "FAIL: ADMIN_PASSWORD path still exists in app code"
            exit 1
          fi
          grep -q "requireUser" lib/supabase/auth.ts || { echo "FAIL: requireUser helper is missing"; exit 1; }
          echo "Admin auth OK"
