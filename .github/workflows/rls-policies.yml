name: RLS Policies

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rls-policies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: RLS enabled and scoped to auth.uid()
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          count=$(grep -ri "enable row level security" supabase --include='*.sql' | wc -l)
          echo "RLS-enabled tables: $count"
          [ "$count" -ge 10 ] || fail "RLS coverage regressed (expected >= 10, got $count)"
          uids=$(grep -r "auth.uid()" supabase --include='*.sql' | wc -l)
          echo "auth.uid() references: $uids"
          [ "$uids" -ge 10 ] || fail "auth.uid() scoping regressed (expected >= 10, got $uids)"
          if grep -rniE "USING\s*\(\s*true\s*\)" supabase --include='*.sql'; then fail "open USING (true) policy found"; fi
          revokes=$(grep -r "revoke all" supabase --include='*.sql' | wc -l)
          echo "Client-grant revokes: $revokes"
          [ "$revokes" -ge 5 ] || fail "client-grant revokes regressed (expected >= 5, got $revokes)"
          echo "RLS OK"
