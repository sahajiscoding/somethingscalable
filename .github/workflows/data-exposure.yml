name: Data Exposure

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: data-exposure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exposure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Partner dashboard minimal by design, own-data only
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          p="app/partner/[token]/page.tsx"
          grep -q "getPartnerDashboard" "$p" || fail "partner dashboard does not load by secret token"
          if grep -q "requireAdmin" "$p"; then fail "partner dashboard wrongly requires admin"; fi
          if grep -q "customer_email" "$p"; then fail "partner dashboard leaks customer emails"; fi
          grep -qE "requireUser|requireAdmin" app/api/me/route.ts || fail "/me does not enforce ownership gate"
          grep -qE "requireUser|requireAdmin" app/api/profile/route.ts || fail "/profile does not enforce ownership gate"
          echo "Data exposure OK"
