name: SSRF and CORS

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ssrf-cors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssrf-cors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Outbound fetches are https-only to fixed allowlist
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q 'url.protocol !== "https:"' app/api/news/route.ts || fail "https-only URL enforcement is missing in news route"
          grep -q "news.google.com" app/api/news/route.ts || fail "news feed allowlist changed"
          if grep -rnE "fetch\(.*req\.|fetch\(.*params\.|fetch\(.*body\." app --include='*.ts'; then fail "user-controlled fetch URL found"; fi
          echo "SSRF guards OK"

      - name: No wildcard CORS
        run: |
          if grep -rnE "origin:\s*['\"\`]\*['\"\`]|Access-Control-Allow-Origin.*\*|\"\\*\",\\s*credentials" app lib proxy.ts --include='*.ts'; then
            echo "FAIL: wildcard CORS origin found (use explicit allowlist)"
            exit 1
          fi
          grep -q "isSafeOrigin" proxy.ts || { echo "FAIL: CSRF origin check missing in proxy.ts"; exit 1; }
          echo "CORS OK"
