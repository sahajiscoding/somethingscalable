name: Password Hashing

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: password-hashing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  passwords:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Passwords delegated to Supabase Auth only
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "signInWithPassword" app/api/auth/signin/route.ts || fail "signin does not use Supabase Auth"
          grep -q "supabase.auth.signUp" app/api/auth/signup/route.ts || fail "signup does not use Supabase Auth"
          grep -q "updateUserById" app/api/auth/reset-password/route.ts || fail "password reset does not use Supabase admin API"
          if grep -rnE "createHash\(|bcrypt|argon2|scrypt" app/api/auth --include='*.ts'; then
            fail "custom password hashing found (use Supabase Auth)"
          fi
          echo "Password delegation OK"
