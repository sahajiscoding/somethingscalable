name: Supabase Hygiene

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: supabase-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Service role stays server-side with fail-closed env
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "function getRequiredEnv" lib/supabase/server.ts || fail "fail-closed env helper is missing"
          grep -q 'getRequiredEnv("SUPABASE_SECRET_KEY")' lib/supabase/server.ts || fail "service-role key is not loaded fail-closed"
          if grep -rn "SUPABASE_SECRET_KEY\|UROPAY_API_SECRET\|ADMIN_SESSION_SECRET\|NVIDIA_API_KEY" app components --include='*.ts' --include='*.tsx'; then
            fail "server secret reachable from client code"
          fi
          echo "Supabase hygiene OK"
