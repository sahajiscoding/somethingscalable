name: Payments Security

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: payments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Webhook signature verification (fail-closed, replay-safe)
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "export function verifyWebhookSignature" lib/payments/uropay.ts || fail "verifyWebhookSignature is missing"
          grep -q "timingSafeEqual" lib/payments/uropay.ts || fail "webhook comparison is not timing-safe"
          grep -q "MAX_AGE_SECONDS" lib/payments/uropay.ts || fail "webhook replay window is missing"
          grep -q "rawBody" app/api/webhooks/uropay/route.ts || fail "webhook route does not use the raw body for verification"
          grep -q "verifyWebhookSignature" app/api/webhooks/uropay/route.ts || fail "webhook route does not verify signatures"
          if grep -rn "PAYMENT_RECONCILIATION_SECRET" app lib --include='*.ts'; then fail "static reconciliation secret still exists"; fi
          echo "Webhook verification OK"

      - name: Authoritative order status + commission repair
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "getOrderStatus" lib/payments/uropay.ts || fail "authoritative order status lookup is missing"
          grep -q "processReferralCommission" app/api/payments/status/route.ts || fail "payment status recovery does not repair commissions"
          grep -q "processReferralCommission" lib/server/payment-reconciliation.ts || fail "reconciliation does not repair commissions"
          grep -q "requireAdmin" app/api/admin/reconcile-payments/route.ts || fail "reconciliation endpoint lacks admin gate"
          echo "Payment lifecycle OK"
