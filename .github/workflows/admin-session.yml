name: Admin Session

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: admin-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Session cookie flags and lifetime
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "httpOnly: true" lib/server/admin-auth.ts || fail "admin cookie is not httpOnly"
          grep -q 'sameSite: "strict"' lib/server/admin-auth.ts || fail "admin cookie is not SameSite=strict"
          grep -q 'secure: process.env.NODE_ENV === "production"' lib/server/admin-auth.ts || fail "admin cookie is not Secure in production"
          grep -q "SESSION_MAX_AGE = 60 \* 60 \* 4" lib/server/admin-auth.ts || fail "admin session lifetime is not 4h"
          echo "Cookie session OK"

      - name: Secret strength and identity binding
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "secret.length < 32" lib/server/admin-auth.ts || fail "ADMIN_SESSION_SECRET 32-char minimum is not enforced"
          grep -q "adminSessionForUid" lib/server/admin-auth.ts || fail "admin sessions are not bound to a Supabase identity"
          grep -q "requireAdminOwner" lib/server/admin-auth.ts || fail "owner-tier enforcement is missing"
          # Promotion must prove current-session AAL2, not merely that a factor
          # is enrolled somewhere on the account.
          grep -q "getAuthenticatorAssuranceLevel" lib/server/admin-auth.ts || fail "admin session does not verify current-session AAL2"
          grep -q 'currentLevel !== "aal2"' lib/server/admin-auth.ts || fail "admin session does not reject first-factor-only sessions"
          grep -q "assertAdminMfaCompleted" lib/server/admin-auth.ts || fail "admin MFA completion gate is missing"
          grep -q "accessToken" app/api/c8f2x9/login/route.ts || fail "admin login does not forward the session token for AAL2 verification"
          echo "Identity binding OK"

      - name: Revocation is monotonic and survives re-approval
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -rq "revoke_admin_user" supabase/migrations || fail "admin revocation tombstone RPC missing from migrations"
          grep -rq "revoked_at" supabase/migrations || fail "revoked_at tombstone column missing from migrations"
          grep -q 'is("revoked_at", null)' lib/server/admin-auth.ts || fail "admin session lookups do not filter revoked admins"
          grep -q "bump_admin_session_version" lib/server/admin-auth.ts || fail "session-version bump path is missing"
          grep -q "rpc(\"revoke_admin_user\"" app/api/c8f2x9/revoke/route.ts || fail "revoke route does not use the tombstone RPC"
          echo "Revocation OK"
