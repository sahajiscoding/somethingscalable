name: Email Verification

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: email-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Unverified users are rejected, no account enumeration
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -q "email_confirmed_at" app/api/auth/signin/route.ts || fail "signin does not enforce email verification"
          grep -q "email_confirmed_at" lib/supabase/auth.ts || fail "requireUser does not enforce email verification"
          if grep -rniE "already exists|user exists|email exists|email taken" app/api/auth/signup/route.ts; then
            fail "signup leaks account existence"
          fi
          if grep -rn "NextResponse.json.*error.message\|return.*error.message" app/api/auth --include='*.ts'; then
            fail "auth route returns raw error text to the client"
          fi
          echo "Email verification OK"
