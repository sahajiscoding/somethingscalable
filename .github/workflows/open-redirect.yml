name: Open Redirect

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: open-redirect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: All redirects stay same-origin with safe fallbacks
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          f="app/auth/callback/route.ts"
          grep -q 'return "/dashboard"' "$f" || fail "unsafe redirect lacks a safe fallback"
          grep -q 'url.origin !== origin' "$f" || fail "redirect target is not pinned to the request origin"
          grep -q "failureRedirect" "$f" || fail "failure path does not use the generic redirect helper"
          if grep -rnE "redirect\(.*(params|searchParams\.get)" app --include='*.ts' --include='*.tsx' | grep -v "getSafeNext\|callback/route"; then
            fail "raw user input passed to a redirect outside the safe helper"
          fi
          echo "Redirect safety OK"
