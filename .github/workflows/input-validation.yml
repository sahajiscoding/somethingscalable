name: Input Validation

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: input-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  input:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: No dynamic code execution or insecure deserialization
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          # security-matrix.mjs excluded: it contains those substrings only
          # inside its own gate patterns (its no-eval/no-new-function gates
          # self-exclude the same way).
          if grep -rnE "\beval\(|new Function\(" app lib components scripts --include='*.ts' --include='*.tsx' --include='*.mjs' --exclude=security-matrix.mjs; then fail "dynamic code execution found"; fi
          if grep -rn "pickle\.loads\|pickle\.load" app lib scripts --include='*.ts' --include='*.mjs' --exclude=security-matrix.mjs; then fail "pickle deserialization found (use JSON)"; fi
          if grep -rnE "createHash\(['\"]md5['\"]|createHash\(['\"]sha1['\"]" app lib --include='*.ts'; then fail "weak hash (MD5/SHA-1) found"; fi
          echo "No dangerous primitives OK"

      - name: No SQL string concatenation
        run: |
          if grep -rnE "SELECT.*\+|query\(.SELECT.*\\\$\{" app lib --include='*.ts'; then
            echo "FAIL: concatenated SQL found (use parameterized queries/ORM)"
            exit 1
          fi
          echo "SQL hygiene OK"

      - name: Zod validation across API routes
        run: |
          count=$(git ls-files 'app/api/**/*.ts' | xargs grep -l 'from "zod"' | wc -l)
          echo "Routes using zod: $count"
          [ "$count" -ge 15 ] || { echo "FAIL: zod coverage regressed (expected >= 15, got $count)"; exit 1; }

      - name: Generic API error responses (no stack traces)
        run: |
          if grep -rnE '"stack"|\bstack\b.*json|stack:\s*error' app/api --include='*.ts'; then
            echo "FAIL: stack trace exposure in API responses"
            exit 1
          fi
          echo "Error responses OK"
