name: Migrations Hygiene

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: migrations-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Money paths stay atomic with serialized guards
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -rq "grant_entitlement_atomic" supabase/migrations || fail "atomic entitlement RPC missing from migrations"
          grep -rq "create_first_referral_commission" supabase/migrations || fail "atomic commission RPC missing from migrations"
          grep -rq "pg_advisory_xact_lock" supabase/migrations || fail "advisory serialization lock missing from migrations"
          grep -rq "self_referral" supabase/migrations || fail "DB self-referral guard missing from migrations"
          grep -rq "rate_limit_check" supabase/migrations || fail "shared rate-limit function missing from migrations"
          # Per-payment redemption ledger: a payment may extend access once.
          grep -rq "entitlement_payment_grants" supabase/migrations || fail "durable payment idempotency ledger missing"
          grep -rq "payment_not_eligible_for_entitlement" supabase/migrations || fail "payment eligibility guard missing from grant RPC"
          # Admin revocation must remain monotonic across delete/re-approve.
          grep -rq "revoked_at" supabase/migrations || fail "admin revocation tombstone missing"
          # AI quota reservation/settlement RPCs.
          grep -rq "reserve_ai_usage" supabase/migrations || fail "AI reservation RPC missing"
          grep -rq "settle_ai_usage" supabase/migrations || fail "AI settlement RPC missing"
          # The RPCs must use the ledger 20260826_ai_usage_daily.sql already created
          # (usage_date / actual_tokens / status). A later `create table if not exists`
          # with other column names is a silent no-op on an existing database while the
          # functions still assume it, which leaves them broken in production.
          ledger=supabase/migrations/20261001_ai_usage_reservations.sql
          [ -f "$ledger" ] || fail "AI reservation migration missing"
          for col in usage_date actual_tokens status; do
            grep -v '^[[:space:]]*--' "$ledger" | grep -Eq "\b${col}\b" || fail "AI reservation RPCs do not use existing ledger column ${col}"
          done
          if grep -v '^[[:space:]]*--' "$ledger" | grep -Eq '\b(usage_day|settled_tokens)\b'; then
            fail "AI reservation migration references ledger columns that do not exist in deployed databases"
          fi
          echo "Migrations hygiene OK"
