name: Audit Logging

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: audit-logging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditlog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Admin actions audited, secrets never logged
        run: |
          fail() { echo "FAIL: $1"; exit 1; }
          grep -rq "admin_audit_log" supabase/migrations || fail "admin audit log table is missing"
          count=$(grep -rl "recordAdminAction" app lib --include='*.ts' | wc -l)
          echo "Files recording admin actions: $count"
          [ "$count" -ge 8 ] || fail "admin audit coverage regressed (expected >= 8, got $count)"
          if grep -rnE "console\.log\(.*[Kk]ey|console\.log\(.*[Ss]ecret|console\.log\(.*[Tt]oken" app lib --include='*.ts'; then
            fail "possible secret in logs"
          fi
          echo "Audit logging OK"
