<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>WeHelpTeachers Launch Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --canvas: #05070a;
        --ink: #ffffff;
        --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 25%, #131922 0%, #05070a 85%);
      }
      .scene-host {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
    >
      <!-- Background Audio Bed -->
      <audio
        id="bg-music"
        data-start="0"
        data-duration="18"
        data-track-index="10"
        data-volume="0.32"
        src="assets/music/happy-beats-business-moves-vol-1-by-ende-dot-app.mp3"
      ></audio>

      <!-- Sound Effects -->
      <audio id="sfx-hook" data-start="0.1" data-duration="0.61" data-track-index="11" data-volume="0.75" src="assets/sfx/impact/impactSoft_medium_000.ogg"></audio>
      <audio id="sfx-c1" data-start="3.8" data-duration="0.17" data-track-index="12" data-volume="0.7" src="assets/sfx/casino/card-slide-1.ogg"></audio>
      <audio id="sfx-c2" data-start="4.5" data-duration="0.17" data-track-index="13" data-volume="0.7" src="assets/sfx/casino/card-slide-1.ogg"></audio>
      <audio id="sfx-c3" data-start="5.2" data-duration="0.69" data-track-index="14" data-volume="0.75" src="assets/sfx/casino/card-place-1.ogg"></audio>
      <audio id="sfx-scan" data-start="8.1" data-duration="0.11" data-track-index="15" data-volume="0.6" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-bell" data-start="13.9" data-duration="1.48" data-track-index="16" data-volume="0.8" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
      <audio id="sfx-click" data-start="16.1" data-duration="0.10" data-track-index="17" data-volume="0.7" src="assets/sfx/interface/click_001.ogg"></audio>

      <!-- Mounted Scenes -->
      <div
        id="scene-1"
        class="clip scene-host"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-2"
        class="clip scene-host"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2.html"
        data-start="3.5"
        data-duration="4.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-3"
        class="clip scene-host"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3.html"
        data-start="8.0"
        data-duration="5.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-4"
        class="clip scene-host"
        data-composition-id="scene4"
        data-composition-src="compositions/scene4.html"
        data-start="13.5"
        data-duration="4.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
